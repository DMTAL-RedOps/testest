
<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cookie Environment Comparison</title>
<style>
body {
  background:#111827;
  color:white;
  font-family:Arial;
  padding:20px;
}
.card {
  background:#1f2937;
  padding:16px;
  border-radius:10px;
  margin:12px 0;
}
pre {
  white-space:pre-wrap;
  overflow-wrap:anywhere;
}
</style>
</head>
<body>

<h2>Browser Cookie Comparison</h2>

<div class="card">
  <h3>Environment</h3>
  <pre id="environment"></pre>
</div>

<div class="card">
  <h3>Cookie Names</h3>
  <pre id="cookies"></pre>
</div>

<div class="card">
  <h3>Storage</h3>
  <pre id="storage"></pre>
</div>

<script>
const data = {
  origin: location.origin,
  userAgent: navigator.userAgent,
  protocol: location.protocol,
  secureContext: isSecureContext,
  cookieApi: typeof document.cookie === "string",
  cookieNames: document.cookie
    .split(";")
    .map(x => x.trim())
    .filter(Boolean)
    .map(x => x.split("=")[0]),
  localStorage: false,
  sessionStorage: false
};

try {
  localStorage.setItem("comparison_test", "ok");
  data.localStorage = true;
  localStorage.removeItem("comparison_test");
} catch(e) {}

try {
  sessionStorage.setItem("comparison_test", "ok");
  data.sessionStorage = true;
  sessionStorage.removeItem("comparison_test");
} catch(e) {}

document.getElementById("environment").textContent =
  JSON.stringify({
    origin: data.origin,
    userAgent: data.userAgent,
    protocol: data.protocol,
    secureContext: data.secureContext
  }, null, 2);

document.getElementById("cookies").textContent =
  JSON.stringify(data.cookieNames, null, 2);

document.getElementById("storage").textContent =
  JSON.stringify({
    localStorage: data.localStorage,
    sessionStorage: data.sessionStorage
  }, null, 2);
</script>

</body>
</html>
