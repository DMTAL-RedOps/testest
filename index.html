
<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WebView Cookie Lab</title>
<style>
body {
  background:#10141e;
  color:#edf2fa;
  font-family:Arial,sans-serif;
  padding:22px;
}
h2 {color:#72a5ff}
.card {
  background:#1c2535;
  padding:17px;
  border-radius:12px;
  margin:15px 0;
}
button {
  width:100%;
  padding:14px;
  margin:7px 0;
  border:0;
  border-radius:8px;
  background:#3978ed;
  color:white;
  font-weight:bold;
}
pre {
  white-space:pre-wrap;
  overflow-wrap:anywhere;
}
.status {color:#62dda0}
</style>
</head>
<body>

<h2>Android WebView Cookie Lab</h2>

<div class="card">
  <b>Browser Information</b>
  <pre id="browser"></pre>
</div>

<div class="card">
  <button onclick="createCookie()">
    CREATE TEST COOKIE
  </button>

  <button onclick="checkCookie()">
    CHECK TEST COOKIE
  </button>

  <button onclick="clearCookie()">
    DELETE TEST COOKIE
  </button>
</div>

<div class="card">
  <b>Test Results</b>
  <pre id="results">Waiting...</pre>
</div>

<script>
const output = document.getElementById("results");

document.getElementById("browser").textContent =
JSON.stringify({
  userAgent: navigator.userAgent,
  origin: location.origin,
  protocol: location.protocol,
  secure: isSecureContext,
  isAndroidWebView: /Android.*; wv\)/i.test(navigator.userAgent),
  isInstagram: /Instagram/i.test(navigator.userAgent)
}, null, 2);

function log(message) {
  output.textContent =
    new Date().toLocaleTimeString() +
    " - " + message + "\n" +
    output.textContent;
}

function createCookie() {
  document.cookie =
    "lab_sessionid=FAKE_SESSION_123456789; Path=/; Secure; SameSite=Lax";

  log("CREATE: " +
    (document.cookie.includes("lab_sessionid=")
      ? "SUCCESS"
      : "COOKIE NOT READABLE"));
}

function checkCookie() {
  const found = document.cookie
    .split(";")
    .some(x => x.trim().startsWith("lab_sessionid="));

  log(found
    ? "CHECK: TEST COOKIE FOUND"
    : "CHECK: TEST COOKIE NOT FOUND");
}

function clearCookie() {
  document.cookie =
    "lab_sessionid=; Max-Age=0; Path=/; Secure; SameSite=Lax";

  log("DELETE: TEST COOKIE CLEARED");
}

</script>
</body>
</html>
